name: Fix metadata
on: workflow_dispatch
jobs:
  fix:
      runs-on: ubuntu-latest
          permissions:
                contents: write
                    steps:
                          - uses: actions/checkout@v4
                                - name: Bulk fix
                                        run: |
                                                  python3 << 'EOF'
                                                            import glob
                                                                      R=[('AE Tax Advisors provides tax advisory and compliance\n            services nationwide.','AE Tax Advisors provides tax advisory and compliance services to business owners and practice owners nationwide.'),('<p>Are You Leaving Tax Savings on the Table?</p>','<p>Business Owners: Are You Overpaying on Taxes?</p>'),('proactive tax planning for high-income professionals, executives, physicians, attorneys, and business owners','proactive tax planning for business owners and practice owners earning $500K-$5M in annual profit'),('for high-income professionals, executives, physicians, attorneys, and business owners earning $500K or more.','for business owners and practice owners earning $500K-$5M in annual profit.'),('for high-income professionals and business owners','for business owners and practice owners'),('"Strategic tax advisory for business owners, real estate investors, and high-income professionals nationwide.','"Strategic tax advisory for business owners, practice owners, and real estate investors nationwide.')]
                                                                                T=['for high-income professionals, executives, physicians, attorneys, a"','for high-income professionals, executives, physicians."','for high-income professionals, executives, physicians, attorneys, and business owne"','for high-income professionals, executives, physicians, attorneys, and bu"']
                                                                                          c=0
                                                                                                    for p in glob.glob('**/index.html',recursive=True):
                                                                                                                try:
                                                                                                                              t=open(p).read();ch=False
                                                                                                                                            for o,n in R:
                                                                                                                                                            if o in t:t=t.replace(o,n);ch=True
                                                                                                                                                                          for o in T:
                                                                                                                                                                                          if o in t:t=t.replace(o,'for business owners and practice owners earning $500K-$5M in annual profit."');ch=True
                                                                                                                                                                                                        if ch:open(p,'w').write(t);c+=1
                                                                                                                                                                                                                    except:pass
                                                                                                                                                                                                                              print(f'Updated {c} files')
                                                                                                                                                                                                                                        EOF
                                                                                                                                                                                                                                              - name: Fix homepage
                                                                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                                                                python3 << 'EOF'
                                                                                                                                                                                                                                                                          f='index.html';c=open(f).read()
                                                                                                                                                                                                                                                                                    c=c.replace('content="Year-round tax planning for business owners and real estate investors, including entity structuring, cost segregation, and IRS-compliant tax strategies."','content="Year-round tax planning for business owners earning $500K-$5M in profit. Entity structuring, cost segregation, and IRS-compliant strategies that cut your tax bill by $50K-$200K per year."')
                                                                                                                                                                                                                                                                                              c=c.replace('content="Strategic tax planning, cost segregation studies, entity structuring, and advanced tax reduction strategies for business owners, S-Corp and C-Corp operators, real estate investors, and multi-entity holders."','content="Tax advisory built for business owners earning $500K-$5M. Entity structuring, cost segregation, retirement plan design, and proactive strategies that save $50K-$200K per year."')
                                                                                                                                                                                                                                                                                                        open(f,'w').write(c)
                                                                                                                                                                                                                                                                                                                  print('Homepage fixed')
                                                                                                                                                                                                                                                                                                                            EOF
                                                                                                                                                                                                                                                                                                                                  - name: Fix llms
                                                                                                                                                                                                                                                                                                                                          run: |
                                                                                                                                                                                                                                                                                                                                                    sed -i 's/business owners, real estate investors, and high-income professionals/business owners earning $500K-$5M in annual profit, practice owners (medical, dental, legal, veterinary), and real estate investors/g' llms.txt llms-full.txt
                                                                                                                                                                                                                                                                                                                                                          - name: Commit
                                                                                                                                                                                                                                                                                                                                                                  run: |
                                                                                                                                                                                                                                                                                                                                                                            git config user.name "AE Tax Advisors Team"
                                                                                                                                                                                                                                                                                                                                                                                      git config user.email "team@aetaxadvisors.com"
                                                                                                                                                                                                                                                                                                                                                                                                git add -A
                                                                                                                                                                                                                                                                                                                                                                                                          git diff --cached --quiet && echo "No changes" && exit 0
                                                                                                                                                                                                                                                                                                                                                                                                                    git commit -m "Optimize metadata to target business owners only"
                                                                                                                                                                                                                                                                                                                                                                                                                              git push
