name: Normalize internal links
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'vercel.json'
      - 'scripts/normalize-internal-links.cjs'
      - 'scripts/check-sitemaps.cjs'
      - 'sitemap*.xml'
      - '.github/workflows/normalize-internal-links.yml'
  workflow_dispatch:
concurrency:
  group: normalize-internal-links
  cancel-in-progress: false
jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize permanent redirect links
        run: node scripts/normalize-internal-links.cjs --write
      - name: Verify no stale links remain
        run: node scripts/normalize-internal-links.cjs --check
      - name: Verify sitemap destinations
        run: node scripts/check-sitemaps.cjs
      - name: Publish cleaned source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo 'All internal links already point to final destinations.'
            exit 0
          fi
          git commit -m 'Normalize internal links to final permanent redirect destinations'
          git push origin HEAD:main
