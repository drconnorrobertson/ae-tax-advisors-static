name: Validate Medium references
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  production-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node scripts/build-release.cjs
      - run: python3 scripts/check-provider-triplets.py public
